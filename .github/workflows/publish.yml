name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-publish:
    name: Build and publish to PyPI/TestPyPI
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required for trusted publishing
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        df -h

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev libavfilter-dev \
            libavdevice-dev pkg-config

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install build dependencies (needed for --no-isolation)
        pip install "setuptools>=45,<70" wheel "cmake>=3.28" pybind11
        # Install CPU-only PyTorch to save disk space (CUDA version is 4GB+)
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install build twine numpy

    - name: Install pybind11
      run: |
        git clone https://github.com/pybind/pybind11.git $HOME/libs/pybind11

    - name: Build package
      run: python -m build --no-isolation

    - name: Repair wheels with auditwheel (Linux)
      if: runner.os == 'Linux'
      run: |
        pip install auditwheel patchelf
        # Show what platform tags are compatible
        auditwheel show dist/*linux*.whl
        # Let auditwheel auto-detect the appropriate manylinux tag
        auditwheel repair dist/*linux*.whl -w dist/
        rm dist/*linux_x86_64.whl  # Remove the original non-manylinux wheel
        ls -lh dist/

    - name: Publish to TestPyPI
      if: github.event_name == 'workflow_dispatch'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true
        print-hash: true

    - name: Publish to PyPI
      if: github.event_name == 'release'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
        print-hash: true
