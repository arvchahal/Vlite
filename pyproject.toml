[build-system]
requires = [
    "setuptools>=45,<70",
    "wheel",
    "cmake>=3.28",
    "pybind11>=2.10.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "vlite"
version = "0.1.0"
description = "Modern C++20 video preprocessing SDK for machine learning"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Arnav Chahal", email = "chahalarnav123@gmail.com"}
]
license.text = "MIT"
keywords = ["video", "preprocessing", "machine-learning", "pytorch", "ffmpeg", "computer-vision"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]
examples = [
    "pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/arvchahal/Vlite"
Documentation = "https://github.com/arvchahal/Vlite/wiki"
Repository = "https://github.com/arvchahal/Vlite"
"Bug Tracker" = "https://github.com/arvchahal/Vlite/issues"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = "test_*.py"
